version: "2"
linters:
  default: none
  enable:
    - bodyclose
    # v1 had no depguard rules; the v2 default would deny every dependency.
    - dogsled
    - errcheck
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    dupl:
      threshold: 100
    funlen:
      lines: 400
      statements: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    govet:
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 200
    misspell:
      locale: US
    nakedret:
      max-func-lines: 100
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # do drains and closes response bodies before returning to these callers.
      - linters:
          - bodyclose
        path: delegate/http\.go
        source: '_, err := p\.do\(ctx, path,'
      # These are public golden test vectors, not credentials.
      - linters:
          - gosec
        path: delegate/http_test\.go
        text: 'G101:'
        source: 'gitleaks:allow.*(fake test fixture|golden SHA-256 test vector)'
      # The request receives ctx with WithContext immediately after construction.
      - linters:
          - noctx
        path: delegate/http\.go
        source: 'req, err := http\.NewRequest\(method, endpoint, &buf\)'
      # UDP Dial selects a local interface here; it does not send network traffic.
      - linters:
          - noctx
        path: poller/poller\.go
        source: 'conn, err := net\.Dial\("udp", "8\.8\.8\.8:80"\)'
      # The discard logger intentionally ignores every argument.
      - linters:
          - revive
        path: logger/logger\.go
        text: 'unused-parameter:'
        source: '^func \(\*discard\)'
      - linters:
          - mnd
        path: _test\.go
      - linters:
          - gocritic
        text: 'unnecessaryDefer:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/golangci/golangci-lint
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
