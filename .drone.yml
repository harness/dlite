---
kind: pipeline
type: vm
name: default

pool:
  use: ubuntu

steps:
- name: vet
  image: harness0.harness.io/oci/docker_artifacts/ubi9/go1:1.26.10-rfcurated@sha256:7bacb3818ae355f31ca9b24d387d83c12fd6082f328a88c79727ee501a4fb90d
  environment:
    GOTOOLCHAIN: local
    GOPATH: /tmp/go
    GOCACHE: /tmp/go-build
  commands:
  - go vet ./...
  volumes:
  - name: gopath
    path: /go
  depends_on:
  - clone

- name: test
  image: harness0.harness.io/oci/docker_artifacts/ubi9/go1:1.26.10-rfcurated@sha256:7bacb3818ae355f31ca9b24d387d83c12fd6082f328a88c79727ee501a4fb90d
  environment:
    GOTOOLCHAIN: local
    GOPATH: /tmp/go
    GOCACHE: /tmp/go-build
  commands:
  - go test -cover ./...
  volumes:
  - name: gopath
    path: /go
  depends_on:
  - vet

- name: check go.mod is up to date
  image: harness0.harness.io/oci/docker_artifacts/ubi9/go1:1.26.10-rfcurated@sha256:7bacb3818ae355f31ca9b24d387d83c12fd6082f328a88c79727ee501a4fb90d
  environment:
    GOTOOLCHAIN: local
    GOPATH: /tmp/go
    GOCACHE: /tmp/go-build
  commands:
  - cp go.mod go.mod.bak
  - go mod tidy
  - diff go.mod go.mod.bak || (echo "go.mod is not up to date" && exit 1)
  volumes:
  - name: gopath
    path: /go
  depends_on:
  - vet

- name: golangci-lint
  image: harness0.harness.io/oci/docker_artifacts/ubi9/go1:1.26.10-rfcurated@sha256:7bacb3818ae355f31ca9b24d387d83c12fd6082f328a88c79727ee501a4fb90d
  environment:
    GOTOOLCHAIN: local
    GOPATH: /tmp/go
    GOCACHE: /tmp/go-build
    GOBIN: /tmp/lint-tools
    GOLANGCI_LINT_CACHE: /tmp/golangci-lint-cache
  commands:
  - go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
  - /tmp/lint-tools/golangci-lint run --timeout 500s --new-from-rev=HEAD~
  volumes:
  - name: gopath
    path: /go
  depends_on:
  - clone

volumes:
- name: gopath
  temp: {}

...
